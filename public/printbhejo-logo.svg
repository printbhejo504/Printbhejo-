<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="PrintBhejo logo">
<defs>
  <linearGradient id="paper" x1="25" y1="210" x2="205" y2="45" gradientUnits="userSpaceOnUse"><stop stop-color="#0879C9"/><stop offset=".5" stop-color="#13C5E8"/><stop offset="1" stop-color="#0754A6"/></linearGradient>
  <linearGradient id="plane" x1="92" y1="174" x2="225" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#06A9E0"/><stop offset=".45" stop-color="#1467D9"/><stop offset=".72" stop-color="#7BDD43"/><stop offset="1" stop-color="#FFC51B"/></linearGradient>
  <linearGradient id="sheet" x1="55" y1="62" x2="130" y2="174" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF5FF"/></linearGradient>
